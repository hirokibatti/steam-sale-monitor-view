<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171a21">
<title>Steamセール監視リスト</title>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#1b2029;--line:#303846;--muted:#aab4c2;--green:#83d49a;--yellow:#ffdf68}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f6fa;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:22px 16px 14px;background:#171a21;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0 0 7px}#updated{color:var(--muted);font-size:12px}
main{max-width:1000px;margin:auto;padding:14px} .tools{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
input,select,button{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit}
input{flex:1;min-width:170px}button{cursor:pointer}
#summary{color:var(--muted);font-size:13px;margin:8px 0 12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin:9px 0}
.name{font-weight:650;line-height:1.45;margin-bottom:9px;color:#fff;text-decoration:none;display:block}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.metric{background:#141922;border-radius:8px;padding:8px}.metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.metric strong{font-size:15px}.lows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:7px}.low-metric{background:#141922;border-radius:8px;padding:8px}.low-metric small{display:block;color:var(--muted);font-size:10px;line-height:1.3;margin-bottom:4px}.low-metric strong{font-size:14px;color:var(--green)}
.discount{color:var(--yellow)}.sale{border-color:#8a6334}.low{color:var(--green)}.sale-end{margin-top:9px;color:#ffd98a;font-size:12px}
.links{display:flex;gap:14px;margin-top:10px;font-size:12px}.links a{color:#9fc8ff;text-decoration:none}
#status{padding:24px;text-align:center;color:var(--muted)}
@media(min-width:700px){#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{margin:0}}
</style>
</head>
<body>
<header><h1>🎮 Steamセール監視リスト</h1><div id="updated">価格履歴を読み込み中…</div></header>
<main>
<div class="tools"><input id="search" type="search" placeholder="ゲーム名で検索"><select id="filter"><option value="all">すべて</option><option value="sale">セール中のみ</option></select><button id="refresh">更新</button></div>
<div id="summary"></div><section id="list"><div id="status">データを読み込んでいます…</div></section>
</main>
<script>
const csvUrl='./%E4%BE%A1%E6%A0%BC%E5%B1%A5%E6%AD%B4.csv';
const activeIdsUrl='./active_ids.csv';

function parseCSV(text){
    const rows=[];
    let row=[],field='',quoted=false;
    for(let i=0;i<text.length;i++){
        const c=text[i];
        if(quoted){
            if(c==='"'&&text[i+1]==='"'){field+='"';i++}
            else if(c==='"')quoted=false;
            else field+=c;
        }else if(c==='"')quoted=true;
        else if(c===','){row.push(field);field=''}
        else if(c==='\n'){row.push(field);rows.push(row);row=[];field=''}
        else if(c!=='\r')field+=c;
    }
    if(field.length||row.length){row.push(field);rows.push(row)}
    return rows;
}

const yen=v=>v===''||v==null?'—':'￥'+Number(v).toLocaleString('ja-JP');

function render(){
    document.getElementById('status').textContent='データを読み込んでいます…';

    Promise.all([
        fetch(csvUrl+'?v='+Date.now()),
        fetch(activeIdsUrl+'?v='+Date.now())
    ])
    .then(async responses=>{
        for(const r of responses){
            if(!r.ok)throw Error('CSVファイルの読み込みに失敗しました。');
        }
        return Promise.all(responses.map(r=>r.text()));
    })
    .then(([historyText,activeText])=>{
        const historyRows=parseCSV(historyText);
        const activeRows=parseCSV(activeText);
        const activeIds=new Set(
            activeRows.slice(1).map(r=>(r[0]||'').trim()).filter(Boolean)
        );

        const data=new Map();
        for(const r of historyRows.slice(1)){
            if(r.length<8)continue;
            const id=(r[1]||'').trim();
            if(id)data.set(id,{
                id,name:r[2],current:r[3],regular:r[4],
                discount:r[5],low:r[6],event:r[7],itadLow:r[8]||'',steamdbLow:r.length>=11?(r[9]||''):'',saleEnd:r.length>=11?(r[10]||''):(r[9]||''),date:r[0]
            });
        }

        const items=[...data.values()]
            .filter(x=>activeIds.has(x.id))
            .sort((a,b)=>{const aSale=Number(a.discount)>0,bSale=Number(b.discount)>0;if(aSale!==bSale)return aSale?-1:1;if(aSale&&bSale){const aEnd=Date.parse((a.saleEnd||'').replace(' ','T')+'+09:00'),bEnd=Date.parse((b.saleEnd||'').replace(' ','T')+'+09:00');if(Number.isFinite(aEnd)&&Number.isFinite(bEnd)&&aEnd!==bEnd)return aEnd-bEnd;if(Number.isFinite(aEnd)!==Number.isFinite(bEnd))return Number.isFinite(aEnd)?-1:1;}return a.name.localeCompare(b.name,'ja');});

        const updated=items.reduce((m,x)=>x.date>m?x.date:m,'');
        document.getElementById('updated').textContent=
            '最終更新：'+(updated ? (updated.trim().endsWith('UTC') ? updated.trim() : updated.trim()+' UTC') : '日時不明');

        window.steamItems=items;
        draw();
    })
    .catch(e=>{
        document.getElementById('status').textContent=
            e.message+' GitHub Pagesの公開状態とCSVファイルを確認してください。';
    });
}
function draw(){const q=document.getElementById('search').value.trim().toLowerCase(),saleOnly=document.getElementById('filter').value==='sale';const items=(window.steamItems||[]).filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!saleOnly||Number(x.discount)>0));document.getElementById('summary').textContent=items.length+'件表示 ／ 登録 '+(window.steamItems||[]).length+'件';const list=document.getElementById('list');list.innerHTML='';if(!items.length){list.innerHTML='<div id="status">該当するゲームがありません</div>';return}
for(const x of items){const typ=x.id.split(':')[0],id=x.id.split(':').pop(),discount=Math.round(Number(x.discount)*100),path=typ==='sub'?'sub':typ==='bundle'?'bundle':'app';const card=document.createElement('article');card.className='item'+(discount>0?' sale':'');const a=document.createElement('a');a.className='name';a.textContent=x.name;a.href='https://steamdb.info/'+path+'/'+id+'/#prices';a.target='_blank';a.rel='noopener';card.appendChild(a);const metrics=document.createElement('div');metrics.className='metrics';const values=[['現在価格',yen(x.current)],['通常価格',yen(x.regular)],['割引率',discount+'%']];for(const [label,value] of values){const m=document.createElement('div');m.className='metric';const s=document.createElement('small');s.textContent=label;const strong=document.createElement('strong');strong.textContent=value;if(label==='割引率'&&discount>0)strong.className='discount';m.append(s,strong);metrics.appendChild(m)}card.appendChild(metrics);const lows=document.createElement('div');lows.className='lows';for(const [label,value] of [['監視開始後最安値',x.low],['ITAD過去最安値',x.itadLow],['SteamDB過去最安値',x.steamdbLow]]){const m=document.createElement('div');m.className='low-metric';const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=value!==''&&value!=null?yen(value):'未登録';m.append(small,strong);lows.appendChild(m)}card.appendChild(lows);if(discount>0){const end=document.createElement('div');end.className='sale-end';if(x.saleEnd){end.textContent='セール終了：'+x.saleEnd+'（日本時間）';}else if(typ==='bundle'){end.textContent='セール終了：バンドル共通の終了日時なし';}else{end.textContent='セール終了：現在取得できません';}card.appendChild(end)}const links=document.createElement('div');links.className='links';const steam=document.createElement('a');steam.href='https://store.steampowered.com/'+path+'/'+id+'/';steam.target='_blank';steam.rel='noopener';steam.textContent='Steamストア';const db=document.createElement('a');db.href=a.href;db.target='_blank';db.rel='noopener';db.textContent='SteamDB価格履歴';links.append(steam,db);card.appendChild(links);list.appendChild(card)}}
document.getElementById('search').addEventListener('input',draw);document.getElementById('filter').addEventListener('change',draw);document.getElementById('refresh').addEventListener('click',render);render();
</script>
</body></html>
